<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <title>Tag Toolbox 分类管理编辑器</title>
    <link rel="stylesheet" href="./editor-styles.css?v=20260802-shell-chrome-v1">
    <script src="./editor-app.js?v=20260802-shell-chrome-v1" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#tag-grid">跳到标签列表</a>

    <div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="loading-mark" aria-hidden="true">T</div>
        <div>
          <strong id="loading-title">正在连接分类编辑数据库</strong>
          <p id="loading-detail">首次启动会导入 152,715 个标签，请稍候。</p>
        </div>
      </div>
    </div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">T</span>
        <div>
          <h1>Tag Toolbox 分类管理编辑器</h1>
          <p id="dataset-summary">正在读取编辑库…</p>
        </div>
      </div>
      <div class="top-actions" role="toolbar" aria-label="保存、导出与编辑历史">
        <span class="save-status" id="save-status">正在确认保存状态…</span>
        <span class="revision-badge" id="revision-badge">revision —</span>
        <button class="button" id="undo-button" type="button" disabled>撤销</button>
        <button class="button" id="redo-button" type="button" disabled>重做</button>
        <button class="button primary" id="snapshot-button" type="button">保存进度</button>
        <button class="button" id="manage-saves-button" type="button">进度管理</button>
        <button class="button export-button" id="export-button" type="button">
          导出词库和分类
        </button>
      </div>
    </header>

    <main class="editor-shell" id="editor-shell" aria-busy="true">
      <section class="tag-panel" aria-labelledby="tag-panel-title">
        <header class="panel-head">
          <div>
            <h2 id="tag-panel-title">标签</h2>
            <p id="active-filter-label">全部分类</p>
          </div>
          <span class="result-summary" id="result-summary" aria-live="polite">等待查询</span>
        </header>

        <div class="search-row">
          <label class="search-box" for="search-input">
            <span>搜索</span>
            <input
              id="search-input"
              type="search"
              autocomplete="off"
              placeholder="中文 / 英文 / 别名…"
            >
          </label>
          <button class="button" id="clear-search" type="button">清空</button>
        </div>

        <div class="filter-row" aria-label="标签筛选">
          <label>
            <span>来源</span>
            <select id="source-filter">
              <option value="all">全部来源</option>
              <option value="m">Main</option>
              <option value="n">NSFW</option>
              <option value="b">双源</option>
            </select>
          </label>
          <label>
            <span>安全</span>
            <select id="safety-filter">
              <option value="all">全部安全等级</option>
              <option value="safe">Safe</option>
              <option value="sensitive">Sensitive</option>
              <option value="adult">Adult</option>
              <option value="blocked">Blocked</option>
              <option value="unknown">Unknown</option>
            </select>
          </label>
          <label>
            <span>状态</span>
            <select id="status-filter">
              <option value="all">全部状态</option>
              <option value="classified">普通标签</option>
              <option value="entity">作品角色</option>
            </select>
          </label>
          <label>
            <span>排序</span>
            <select id="sort-filter">
              <option value="alpha">英文词典顺序</option>
              <option value="heat">热度降序</option>
            </select>
          </label>
        </div>

        <div class="selection-bar" id="selection-bar" aria-label="批量选择操作">
          <strong id="selection-summary">未选择标签</strong>
          <div class="selection-actions">
            <button class="button compact" id="select-page" type="button">选择本页</button>
            <button class="button compact" id="select-all-results" type="button">
              全选当前结果
            </button>
            <button class="button compact" id="clear-selected" type="button" disabled>
              清除选择
            </button>
            <button class="button compact danger" id="unassign-selected" type="button" disabled>
              移到未归类
            </button>
          </div>
        </div>

        <div
          class="tag-viewport"
          id="tag-viewport"
          aria-label="可框选标签区域"
        >
          <div class="selection-rectangle" id="selection-rectangle" hidden></div>
          <div class="tag-grid" id="tag-grid" tabindex="-1" aria-label="标签查询结果"></div>
          <div class="empty-state" id="tag-empty" hidden>
            当前条件没有标签。
          </div>
        </div>

        <footer class="pager">
          <button class="button" id="previous-page" type="button" disabled>上一页</button>
          <span id="page-summary">第 1 页</span>
          <button class="button" id="next-page" type="button" disabled>下一页</button>
        </footer>
      </section>

      <section class="taxonomy-panel" aria-labelledby="taxonomy-title">
        <header class="panel-head taxonomy-head">
          <div>
            <h2 id="taxonomy-title">分类树</h2>
            <p>L1～L5 · 拖入节点即可批量归类</p>
          </div>
          <button class="button primary" id="create-root" type="button">新建 L1</button>
        </header>

        <div class="tree-tools">
          <button class="button compact" id="expand-all" type="button">全部展开</button>
          <button class="button compact" id="collapse-all" type="button">全部折叠</button>
          <span id="taxonomy-summary">等待分类树</span>
        </div>

        <div class="taxonomy-tree" id="taxonomy-tree" role="tree" aria-label="L1 到 L5 分类树">
        </div>

        <section class="history-panel" aria-labelledby="history-title">
          <header>
            <h3 id="history-title">操作历史</h3>
            <span>每次批量拖放只记为一条事务</span>
          </header>
          <ol id="history-list" class="history-list"></ol>
        </section>
      </section>
    </main>

    <dialog class="node-dialog" id="node-dialog">
      <form method="dialog" id="node-form">
        <header>
          <h2 id="node-dialog-title">创建分类</h2>
          <button class="icon-button" id="close-node-dialog" type="button" aria-label="关闭">
            ×
          </button>
        </header>
        <input id="node-mode" type="hidden">
        <input id="node-id" type="hidden">
        <input id="node-parent-id" type="hidden">
        <label for="node-label">
          <span>中文分类名</span>
          <input id="node-label" maxlength="80" autocomplete="off" required>
        </label>
        <p id="node-dialog-hint"></p>
        <footer>
          <button class="button" id="cancel-node-dialog" type="button">取消</button>
          <button class="button primary" id="submit-node-dialog" type="submit">保存</button>
        </footer>
      </form>
    </dialog>

    <dialog class="node-dialog saves-dialog" id="saves-dialog">
      <section>
        <header>
          <div>
            <h2>保存进度管理</h2>
            <p>每次编辑均自动落盘；这里保存的是可恢复的完整检查点。</p>
          </div>
          <button class="icon-button" id="close-saves-dialog" type="button" aria-label="关闭">
            ×
          </button>
        </header>
        <div class="saves-list" id="saves-list" aria-live="polite">
          正在读取进度点…
        </div>
        <footer>
          <button class="button" id="refresh-saves-button" type="button">刷新列表</button>
          <button class="button primary" id="save-from-dialog-button" type="button">
            保存当前进度
          </button>
        </footer>
      </section>
    </dialog>

    <div class="drag-preview" id="drag-preview" hidden aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>

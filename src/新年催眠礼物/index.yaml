# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
头像: null
版本: 0.1.0
作者: MC王大锤 / TavernWeave
备注: '改编自《春节期间前往女友家拜年的我用催眠大法...》的成人向催眠互动卡。所有角色均已成年。'

第一条消息:
  - 文件: 第一条消息/0
  - 文件: 第一条消息/1

角色描述: ''

锚点:
  - &分隔符
    启用: false
    激活策略:
      类型: 向量化
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    激活概率: 100
    内容: ''
  - &立即事件
    启用: true
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    特殊效果:
      黏性: 5
      冷却: 9999
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

世界书名称: 与角色卡名称相同
条目:
  - 名称: '[mvu_plot]文风'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/文风

  - 名称: '[mvu_plot]角色详情'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色/角色详情

  - 名称: '[mvu_plot]角色阶段'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色/角色阶段

  - 文件夹: 变量
    条目:
      - 名称: ===变量开始===
        <<: *分隔符

      - 名称: '[initvar]变量初始化勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/initvar

      - 名称: 变量列表
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量列表

      - 名称: '[mvu_update]变量更新规则'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量更新规则

      - 名称: '[mvu_update]变量输出格式'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量输出格式

      - 名称: ===变量结束===
        <<: *分隔符

  - 名称: '[mvu_plot]剧情CoT'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/CoT/剧情CoT

  - 文件夹: 事件
    条目:
      - 名称: ===事件开始===
        <<: *分隔符

      - 名称: '[mvu_plot][阶段事件]芸曦催眠阶段推进'
        <<: *立即事件
        激活策略:
          类型: 绿灯
          关键字:
            - 【阶段事件·芸曦】
        文件: 世界书/事件/芸曦阶段事件

      - 名称: '[mvu_plot][阶段事件]戚巧瑜催眠阶段推进'
        <<: *立即事件
        激活策略:
          类型: 绿灯
          关键字:
            - 【阶段事件·戚巧瑜】
        文件: 世界书/事件/戚巧瑜阶段事件

      - 名称: '[mvu_plot][阶段事件]璐瑶催眠阶段推进'
        <<: *立即事件
        激活策略:
          类型: 绿灯
          关键字:
            - 【阶段事件·璐瑶】
        文件: 世界书/事件/璐瑶阶段事件

      - 名称: ===事件结束===
        <<: *分隔符

扩展字段:
  正则:
    - 正则名称: '[不发送]去除变量更新'
      id: 9d2f14c0-0a51-4f2b-9f8e-6b1a24e7c8d1
      启用: true
      查找表达式: /<update(?:variable)?>(?:(?!.*<\/update(?:variable)?>).*$|.*<\/update(?:variable)?>)/gsi
      内容: ''
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true
      最大深度: 3

    - 正则名称: '[折叠]变量更新中'
      id: 51d66a2f-2c14-4d0e-9a27-9c1b0d2f1a83
      启用: true
      查找表达式: /<update(?:variable)?>(?!.*<\/update(?:variable)?>)\s*(.*)\s*$/gsi
      内容: |-

        <details>
        <summary>变量更新中{{random::.::..::...}}</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[折叠]完整变量更新'
      id: 7c8a0e5b-90d4-4c12-a6b5-3f2d16e09d44
      启用: true
      查找表达式: /<update(?:variable)?>\s*(.*)\s*<\/update(?:variable)?>/gsi
      内容: |-

        <details>
        <summary>变量更新情况</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[界面]开局首页'
      id: 3a0e5f3b-8d6e-4d31-9c4f-9c85b77d6e11
      启用: true
      查找表达式: <OpeningPlaceHolderImpl/>
      文件: 正则/开局首页.txt
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[界面]状态栏'
      id: 5d9c3e1f-4a2b-4e30-9c81-aa2f65c1b77d
      启用: true
      查找表达式: <StatusPlaceHolderImpl/>
      文件: 正则/状态栏.txt
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

  酒馆助手:
    脚本库:
      - 名称: mvu
        id: 8a1b2c3d-4e5f-4a6b-8c9d-0e1f2a3b4c5d
        启用: true
        类型: 脚本
        内容: |-
          import 'https://testingcf.jsdelivr.net/gh/MagicalAstrogy/MagVarUpdate/artifact/bundle.js';

      - 名称: 变量结构
        id: 9b2c3d4e-5f6a-4b7c-9d0e-1f2a3b4c5d6e
        启用: true
        类型: 脚本
        文件: ../../dist/新年催眠礼物/脚本/变量结构/index.js

      - 名称: 阶段事件
        id: 0c3d4e5f-6a7b-4c8d-9e0f-2a3b4c5d6e7f
        启用: true
        类型: 脚本
        文件: ../../dist/新年催眠礼物/脚本/阶段事件/index.js

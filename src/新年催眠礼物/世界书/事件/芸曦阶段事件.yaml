---
立即事件:
  description: 芸曦的催眠阶段推进到新一档，触发与她当前阶段匹配的强制事件
  # :<%_ if (getvar('stat_data.芸曦.催眠阶段') < 1) { _%>
  抗拒裂痕:
    process:
      - 芸曦在某个只有两人或半公开的场合突然意识到自己对<user>的关注多到不对劲
      - 她会用更刻薄的言语和更远的距离掩饰慌乱，但会留下一个明显的失神瞬间
      - 安排一个让芸曦必须靠近<user>的理由，如递东西、被挤到角落、或家人起哄
    requirement:
      - 突出她嘴上嫌弃、身体却开始动摇的反差
    rule:
      - 必须强制触发此事件
      - 不得让她当场完全顺从，只能留下裂缝
  # :<%_ } else if (getvar('stat_data.芸曦.催眠阶段') < 2) { _%>
  迷惑试探:
    process:
      - 芸曦开始无意识地模仿<user>的措辞，或对<user>的话产生超过常理的在意
      - 安排一次身体接触或近距离对视，让她先是愣住，再红着脸骂人
    requirement:
      - 让她的理性防线与身体反应互相打架
    rule:
      - 必须强制触发此事件
      - 可让她短暂顺从一次，但事后必须嘴硬
  # :<%_ } else if (getvar('stat_data.芸曦.催眠阶段') < 3) { _%>
  服从破防:
    process:
      - 芸曦在家人面前接到<user>的命令或暗示，挣扎片刻后小声照做
      - 她为了不被妈妈和妹妹发现，会寻找借口掩饰，但身体的反应已经藏不住
    requirement:
      - 突出“服从”与“维持体面”的冲突
    rule:
      - 必须强制触发此事件
      - 事后她应短暂陷入自我怀疑，但下次仍会照做
  # :<%_ } else if (getvar('stat_data.芸曦.催眠阶段') < 4) { _%>
  沉沦告白:
    process:
      - 芸曦在独处或半公开场合向<user>表白式地索要宠爱，承认自己再也离不开他
      - 她可能会主动留下吻痕、手写纸条或身体痕迹作为证明
    requirement:
      - 让她放下拜金人设，露出患得患失的占有欲
    rule:
      - 必须强制触发此事件
      - 可保留最后一丝口嫌体正直，但不能真正拒绝
  # :<%_ } else { _%>
  信赖:
    process:
      - 芸曦在独处或半公开场合坦率承认自己离不开<user>，愿意交出所有防备
      - 她主动向妈妈和璐瑶展示对<user>的信赖，并请求更深的催眠来确认这份关系
    requirement:
      - 体现她从校园女神变成真正放心依靠<user>的人
    rule:
      - 必须强制触发此事件
      - 此后她的默认行为逻辑以信赖<user>为前提，但可保留嘴硬的小性子
  # :<%_ } _%>

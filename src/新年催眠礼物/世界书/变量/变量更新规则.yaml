---
变量更新规则:
  世界:
    当前时间:
      format: 春节期间的日期与时刻
      check:
        - 每次剧情推进、场景切换或休息后更新
        - 快进或跳转时必须说明时间跨度
    当前地点:
      check:
        - 角色所在场所发生变化时更新
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录当前悬而未决的任务、约定、重要事件
        - 完成后移除，新增事务时及时添加
        - 最多保持 4-6 项活跃事务
  主角:
    出身:
      check:
        - 开局确认后一般不再变化
        - 只允许在玩家明确选择的配置范围内取值
    催眠风格:
      check:
        - 开局确认后一般不再变化
        - 只允许在玩家明确选择的配置范围内取值
    催眠能力:
      check:
        - 只在能力获得强化、削弱或觉醒新用法时更新
    目标:
      check:
        - 主角阶段性目标完成、改变或新增时更新
  芸曦:
    催眠阶段:
      type: number
      range: 0~4
      check:
        - 0抗拒、1迷惑、2服从、3沉沦、4信赖
        - 每次只能因明确的催眠互动或重大事件提高，单次提高不超过1
        - 若剧情中被强烈反抗、清醒或识破，可下降但不超过1
    身体部位.${脸|胸|下体|腿|全身}:
      check:
        - 只描述该部位当前真实可见或可感知的状态
        - 每个部位保持一段完整描写，包含气色、湿润度、颤抖、潮红、液体痕迹等
        - 状态随剧情即时变化，不写未发生的未来
    服装:
      check:
        - 换装、破损、解开、弄脏、褪下时更新
        - 保持整段服装描写，包含颜色、材质、款式、当前状态
    心里话:
      check:
        - 根据剧情中角色的真实反应重写，与当前催眠阶段匹配
        - 必须是该角色藏起来的真实想法，不能是能直接说出口的话

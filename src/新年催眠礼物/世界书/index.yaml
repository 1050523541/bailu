# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/worldbook.zh.json
锚点:
  - &分隔符
    启用: false
    激活策略:
      类型: 绿灯
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    激活概率: 100
    内容: ''
  - &立即事件
    启用: true
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    特殊效果:
      黏性: 5
      冷却: 9999
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true

条目:
  - 名称: '[mvu_plot]文风'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 文风

  - 名称: '[mvu_plot]角色详情'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 角色/角色详情

  - 名称: '[mvu_plot]角色阶段'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 角色/角色阶段

  - 文件夹: 变量
    条目:
      - 名称: ===变量开始===
        <<: *分隔符

      - 名称: '[initvar]变量初始化勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 变量/initvar

      - 名称: 变量列表
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 变量/变量列表

      - 名称: '[mvu_update]变量更新规则'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 变量/变量更新规则

      - 名称: '[mvu_update]变量输出格式'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 变量/变量输出格式

      - 名称: ===变量结束===
        <<: *分隔符

  - 名称: '[mvu_plot]剧情CoT'
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 14720
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: CoT/剧情CoT

  - 文件夹: 事件
    条目:
      - 名称: ===事件开始===
        <<: *分隔符

      - 名称: '[mvu_plot][阶段事件]芸曦催眠阶段推进'
        <<: *立即事件
        激活策略:
          类型: 绿灯
          关键字:
            - 【阶段事件·芸曦】
        文件: 事件/芸曦阶段事件

      - 名称: '[mvu_plot][阶段事件]戚巧瑜催眠阶段推进'
        <<: *立即事件
        激活策略:
          类型: 绿灯
          关键字:
            - 【阶段事件·戚巧瑜】
        文件: 事件/戚巧瑜阶段事件

      - 名称: '[mvu_plot][阶段事件]璐瑶催眠阶段推进'
        <<: *立即事件
        激活策略:
          类型: 绿灯
          关键字:
            - 【阶段事件·璐瑶】
        文件: 事件/璐瑶阶段事件

      - 名称: ===事件结束===
        <<: *分隔符
